[project]
name = "cloudsegmentation"
version = "0.1.0"
description = "CPU inference service for Sentinel-1 surface-water segmentation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "google-cloud-storage",
    "numpy==2.2.6",
    "onnxruntime==1.23.2",
    "pillow",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
